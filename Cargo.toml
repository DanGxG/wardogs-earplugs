[package]
name = "wardogs-earplugs"
version = "0.1.2"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Tiny Windows tray utility to toggle WarDogs mixer volume with F2"

[dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }

[build-dependencies]
winresource = "=0.1.23"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
