name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v0.1.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Check, test and build
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: windows-unsigned
          path: target/release/wardogs-earplugs.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate release tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:REQUESTED_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag.' }
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ($env:REQUESTED_TAG -ne "v$version") { throw 'Tag must match Cargo.toml version.' }
          "RELEASE_TAG=$env:REQUESTED_TAG" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-unsigned
          path: unsigned
      - name: Request trusted signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_CONFIGURED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          $trusted = $env:SIGNING_CONFIGURED -eq 'true'
          if ($trusted) {
            ./scripts/package.ps1 -Executable signed/wardogs-earplugs.exe -Tag $env:RELEASE_TAG -RequireSignature
            $title = "WarDogs Earplugs $env:RELEASE_TAG"
            $notes = "Portable Windows x64 app: F2 keeps a chosen percentage of each game session's original volume (default 40%: original 80% becomes 32%). Apply uses the same original base: 40/60/80 gives 32/48/64 for an original 80%, without accumulating reductions. 0 silences; 100 keeps the original. Existing saved numbers are preserved, but v0.1.5 interprets them as percentages of the original. An independent top-left badge shows Earplugs ON. Raw Input handles held modifiers and repeats without hooks, keyboard logging or game process access; remove conflicting F2 bindings. Checks GitHub once at startup, including --background, and offers newer versions with a Spanish Sí/No prompt (No by default). Declining downloads no EXE; accepted downloads verify the captured version/hash and Windows x64 format, plus Authenticode trust for signed assets. Replacement keeps settings/path/tray mode, restores volume first and retains a backup until the new UI is ready. Folder write permission is required; no administrator access, periodic checker or service. v0.1.4 can offer v0.1.5 at startup; v0.1.3 and earlier users must install v0.1.5 manually. See VALIDATION.md for executed checks and remaining limits, including the full live keyboard matrix. This executable has a valid Authenticode signature. New-publisher reputation warnings may still occur."
          } else {
            ./scripts/package.ps1 -Executable unsigned/wardogs-earplugs.exe -Tag $env:RELEASE_TAG
            $title = "WarDogs Earplugs $env:RELEASE_TAG — unsigned draft, signing pending"
            $notes = "CI build, UNSIGNED: trusted signing is pending enrollment and identity validation. The maintainer can explicitly publish this draft unsigned; see SIGNING.md. F2 keeps a chosen percentage of each game session's original volume (default 40%: original 80% becomes 32%). Apply uses the same original base: 40/60/80 gives 32/48/64 for an original 80%, without accumulating reductions. 0 silences; 100 keeps the original. Existing saved numbers are preserved, but v0.1.5 interprets them as percentages of the original. An independent top-left badge shows Earplugs ON. Raw Input handles held modifiers and repeats without hooks, keyboard logging, game process handles or game-window attachment; remove conflicting F2 bindings. Checks GitHub once at startup, including --background, and offers newer versions with a Spanish Sí/No prompt (No by default). Declining downloads no EXE; accepted downloads verify the captured version/hash and Windows x64 format, plus Authenticode trust for signed assets. Hash verification does not sign an unsigned EXE. Replacement keeps settings/path/tray mode, restores volume first and retains a backup until the new UI is ready. Folder write permission is required; no administrator access, periodic checker or service. v0.1.4 can offer v0.1.5 at startup; v0.1.3 and earlier users must install v0.1.5 manually. See VALIDATION.md for executed checks and remaining limits, including the full live keyboard matrix."
          }
          $notes | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title $title --notes-file release-notes.txt
            if ($LASTEXITCODE) { throw 'Could not create draft release.' }
          } elseif (-not $trusted) {
            $isDraft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft
            if ($LASTEXITCODE -or $isDraft -ne 'true') { throw 'Refusing to replace a published release with unsigned binaries.' }
          }
          $files = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE) { throw 'Could not upload release assets.' }
          if ($trusted) {
            $existingAssets = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
            if ($LASTEXITCODE) { throw 'Could not inspect existing release assets.' }
            foreach ($unsignedAsset in @("wardogs-earplugs-$env:RELEASE_TAG-windows-x64-unsigned.exe", "wardogs-earplugs-$env:RELEASE_TAG-windows-x64-unsigned.zip")) {
              if ($existingAssets -contains $unsignedAsset) {
                gh release delete-asset $env:RELEASE_TAG $unsignedAsset --yes
                if ($LASTEXITCODE) { throw 'Could not remove the superseded unsigned draft asset.' }
              }
            }
            gh release edit $env:RELEASE_TAG --title $title --notes-file release-notes.txt --draft=false
            if ($LASTEXITCODE) { throw 'Could not publish signed release.' }
          } else {
            gh release edit $env:RELEASE_TAG --title $title --notes-file release-notes.txt --draft=true
            if ($LASTEXITCODE) { throw 'Could not retain unsigned draft.' }
          }
